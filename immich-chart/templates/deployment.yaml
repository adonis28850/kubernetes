# Immich Component Deployments

apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.immich.server.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        app.kubernetes.io/component: server
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.persistence.nodeName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-database
          image: busybox:latest
          command: ['sh', '-c', 'until nc -vz -w 5 immich-database 5432; do echo waiting for database; sleep 2; done;']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        - name: wait-for-valkey
          image: busybox:latest
          command: ['sh', '-c', 'until nc -vz -w 5 immich-valkey 6379; do echo waiting for valkey; sleep 2; done;']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      containers:
        - name: server
          image: "{{ .Values.immich.server.repository }}:{{ .Values.immich.server.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOSTNAME
              value: immich-database
            - name: DB_USERNAME
              value: {{ .Values.database.auth.user }}
            - name: DB_PASSWORD
              value: {{ .Values.database.auth.password }}
            - name: DB_DATABASE_NAME
              value: {{ .Values.database.auth.database }}
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            - name: IMMICH_METRICS
              value: "false"
          volumeMounts:
            - name: library
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
        - name: tmp
          emptyDir: {}
---
{{- if .Values.immich.microservices.enabled }}
