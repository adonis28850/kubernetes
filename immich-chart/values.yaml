# Default values for immich-chart.

namespace: immich
# Common image configuration
image:
  pullPolicy: IfNotPresent
# Immich Server, Microservices and Machine Learning settings
immich:
  server:
    repository: ghcr.io/immich-app/immich-server
    tag: "v3.0.1" # {"$imagepolicy": "flux-system:immich-server-policy:tag"}
    replicaCount: 1
  microservices:
    repository: ghcr.io/immich-app/immich-server
    tag: "v3.0.1" # {"$imagepolicy": "flux-system:immich-server-policy:tag"}
    replicaCount: 1
    enabled: false
  machineLearning:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: "v2.7.5" # {"$imagepolicy": "flux-system:immich-ml-policy:tag"}
    replicaCount: 1
# Database settings
database:
  image:
    repository: ghcr.io/immich-app/postgres
    tag: 17-vectorchord0.5.3-pgvector0.8.1 # {"$imagepolicy": "flux-system:immich-database-policy:tag"}
  auth:
    database: immich
    user: postgres
    password: immichpassword
# Valkey settings (Caching layer)
valkey:
  image:
    repository: valkey/valkey
    tag: 9.1.0 # {"$imagepolicy": "flux-system:valkey-policy:tag"}
service:
  type: ClusterIP
# Health check probes
probes:
  server:
    liveness:
      initialDelaySeconds: 120
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 90
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  microservices:
    liveness:
      initialDelaySeconds: 120
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 90
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  machineLearning:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  database:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  valkey:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
# Storage settings
persistence:
  # Node name where the local volumes are physically located
  nodeName: k3s-cluster
  library:
    storageClass: local-path
    size: 100Gi
    accessMode: ReadWriteOnce
    hostPath: /srv/dev-disk-by-uuid-2a3b438e-c3d9-4623-80b5-2a887dae15fe/Immich/ImmichUploads
  database:
    storageClass: local-path
    size: 10Gi
    accessMode: ReadWriteOnce
    hostPath: /srv/dev-disk-by-uuid-2a3b438e-c3d9-4623-80b5-2a887dae15fe/Immich/ImmichDB
  valkey:
    storageClass: local-path
    size: 1Gi
    accessMode: ReadWriteOnce
    hostPath: /srv/dev-disk-by-uuid-2a3b438e-c3d9-4623-80b5-2a887dae15fe/Immich/ImmichValKey
# Gateway API settings
gateway:
  name: traefik-gateway
  namespace: traefik
  gatewayClassName: traefik
  hostname: immich.casa.local
  # Certificate name for HTTPS. 
  # If left empty, Traefik will use its default certificate (if configured).
  certificateName: ""
# Security Contexts
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
