replicaCount: 1
image:
  repository: tomsquest/docker-radicale
  pullPolicy: IfNotPresent
  tag: "tomsquest/docker-radicale:3.6.0.0" # {"$imagepolicy": "flux-system:radicale-policy"}
namespace: radicale
# Persistence configuration using static provisioning with local PVs
persistence:
  # Configuration volume
  config:
    storageClass: local-storage
    size: 500Mi
    # Mounted as read-only to prevent modifications by the pod
    accessMode: ReadOnlyMany
    # Host path on the node where data is stored
    hostPath: /srv/dev-disk-by-uuid-2a3b438e-c3d9-4623-80b5-2a887dae15fe/Radicale/config/
  # Data volume
  data:
    storageClass: local-storage
    size: 10Gi
    accessMode: ReadWriteOnce
    # Host path on the node where data is stored
    hostPath: /srv/dev-disk-by-uuid-2a3b438e-c3d9-4623-80b5-2a887dae15fe/Radicale/data/
  # Node where the local volumes are physically located
  nodeName: k3s-cluster
service:
  type: ClusterIP
  port: 5232
# Gateway API Configuration
gateway:
  name: traefik-gateway
  namespace: traefik
  gatewayClassName: traefik
  # The hostname used to access Radicale
  hostname: radicale.casa.local
  # Certificate name for HTTPS. 
  # If left empty, Traefik will use its default certificate (if configured).
  certificateName: ""
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: Always
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
env: {}
