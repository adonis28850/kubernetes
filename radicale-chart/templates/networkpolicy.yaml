# NetworkPolicy to restrict traffic to the Radicale pod for security.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radicale-policy
  namespace: {{ .Values.namespace }}
spec:
  # Apply this policy to pods with label app: radicale
  podSelector:
    matchLabels:
      app: radicale
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming TCP traffic only from the Gateway namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Allow outgoing traffic for DNS resolution (required for name lookups)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
