# Weather Station Ingestor NetworkPolicy

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.fullnameOverride | default (printf "%s-ingestor" .Release.Name) }}-networkpolicy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: weather-station-ingestor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: weather-station-ingestor
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  # No ingress needed - ingestor only sends data to core
  # Allow egress to Core and DNS only
  egress:
    # DNS access
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Core API access
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: weather-station
          podSelector:
            matchLabels:
              app.kubernetes.io/name: weather-station-core
      ports:
        - protocol: TCP
          port: 8080