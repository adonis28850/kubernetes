# AIOStreams Secret
# Stores the SECRET_KEY required for AIOStreams to start.
# The secret key must be a 64-character hex string generated with: openssl rand -hex 32

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fullnameOverride | default (printf "%s-%s" .Release.Name .Values.name) }}-secret
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  # Base64-encoded secret key (decoded by the deployment)
  secret-key: {{ .Values.secret.secretKey | b64enc }}