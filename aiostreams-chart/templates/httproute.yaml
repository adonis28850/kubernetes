# AIOStreams HTTPRoute
# Routes HTTPS traffic from the Traefik Gateway to the AIOStreams service.
# This allows external access to AIOStreams via aiostreams.casa.local.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.fullnameOverride | default (printf "%s-%s" .Release.Name .Values.name) }}-httproute
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Reference to the shared Traefik Gateway
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  # Route only requests for this specific hostname
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.fullnameOverride | default (printf "%s-%s" .Release.Name .Values.name) }}
          port: {{ .Values.service.port }}
      matches:
        - path:
            type: PathPrefix
            value: /