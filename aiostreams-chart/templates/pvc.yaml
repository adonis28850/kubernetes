# AIOStreams PersistentVolumeClaim
# Claims the static PV for AIOStreams data storage.
# This PVC is bound to the corresponding PV by name.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.fullnameOverride | default (printf "%s-%s" .Release.Name .Values.name) }}-data
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  storageClassName: {{ .Values.persistence.data.storageClass }}
  # Explicitly bind to the PV created for this application
  volumeName: {{ .Values.fullnameOverride | default (printf "%s-%s" .Release.Name .Values.name) }}-data-pv