# Configuration to enable and expose Traefik Dashboard using Gateway API
api:
  dashboard: true
  insecure: false

# Extra Kubernetes resources to configure the dashboard routing and security
extraObjects:
  # Basic Authentication Middleware
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-dashboard-auth
      namespace: traefik
    spec:
      basicAuth:
        secret: dashboard-auth

  # HTTPRoute for the Traefik Dashboard
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: traefik-dashboard
      namespace: traefik
    spec:
      # Hostname for the dashboard
      hostnames:
        - traefik.k3s.local
      # Attach primarily to the websecure (HTTPS) listener
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
          sectionName: websecure
      rules:
        # Redirect root / to /dashboard/
        - matches:
            - path:
                type: Exact
                value: /
          filters:
            - type: RequestRedirect
              requestRedirect:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /dashboard/
                statusCode: 302
        # Expose dashboard and API with basic auth
        - matches:
            - path:
                type: PathPrefix
                value: /dashboard/
            - path:
                type: PathPrefix
                value: /api/
          filters:
            # Use ExtensionRef to apply the basic auth middleware
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: traefik-dashboard-auth
          backendRefs:
            - name: api@internal
              group: traefik.io
              kind: TraefikService
              port: 8080
