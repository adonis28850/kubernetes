# Traefik Helm Chart Values
# This block handles the "manual" connection between K3s and the OMV Host OS.

extraObjects:
  # 1. Service: Acts as the internal DNS name for Traefik to target
  - apiVersion: v1
    kind: Service
    metadata:
      name: omv-external
      namespace: traefik
    spec:
      ports:
        - protocol: TCP
          port: 8081
          targetPort: 8081

  # 2. EndpointSlice: Maps the Service above to the physical OMV IP (Modern version)
  - apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      name: omv-external-slice
      namespace: traefik
      labels:
        kubernetes.io/service-name: omv-external
    addressType: IPv4
    ports:
      - port: 8081
        protocol: TCP
    endpoints:
      - addresses:
          - 192.168.0.227

  # 3. HTTPRoute: The Gateway API rule for the domain name
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: omv-gui-route
      namespace: traefik
    spec:
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
          sectionName: websecure
      hostnames:
        - "openmediavault.casa.local"
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: omv-external
              port: 8081

