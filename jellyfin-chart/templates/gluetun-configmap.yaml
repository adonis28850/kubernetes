# Gluetun ConfigMap
# Contains non-sensitive configuration for Gluetun VPN client.
# Sensitive credentials (private key) are stored in a separate Secret.
#
# TEMPORARY WORKAROUND: This ConfigMap is part of a temporary Gluetun implementation
# using extraContainers. When the official Jellyfin Helm chart v3.0.0 is released with
# extraInitContainers support, this should be updated to use the proper native sidecar
# pattern with restartPolicy: Always.

apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-config
  namespace: {{ .Release.Namespace }}
data:
  # Timezone
  TZ: "Etc/UTC"

  # VPN Configuration - ProtonVPN Native
  VPN_SERVICE_PROVIDER: "protonvpn"
  VPN_TYPE: "wireguard"

  # Server Selection - Streaming-optimized servers for better performance
  STREAMING_ONLY: "on"
  SERVER_COUNTRIES: "Spain"

  # DNS Configuration - CRITICAL for cluster DNS
  DNS_ADDRESS: "1.1.1.1"
  DNS_KEEP_NAMESERVER: "on"  # Maintains cluster DNS resolution
  DOT: "off"                   # Disable DNS over TLS

  # Firewall Configuration
  FIREWALL_INPUT_PORTS: "8096"  # Allow Jellyfin web UI
  FIREWALL_OUTBOUND_SUBNETS: "10.0.0.0/8,192.168.0.0/16"  # Allow cluster + LAN

  # Server list updater (recommended for paid users)
  UPDATER_PERIOD: "24h"  # Update server list every 24 hours