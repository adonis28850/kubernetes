# Jellyfin Helm Chart Values
# This file configures the official Jellyfin Helm chart for deployment.
# See: https://github.com/jellyfin/jellyfin-helm

# Image configuration
image:
  repository: jellyfin/jellyfin
  pullPolicy: IfNotPresent
  # Flux image automation marker - Flux will update this tag when new versions are released
  tag: "10.11.10" # {"$imagepolicy": "flux-system:jellyfin-policy:tag"}
# Replica configuration
replicaCount: 1
# Service configuration
service:
  type: ClusterIP
  port: 8096
# Ingress configuration (disabled - using Gateway API instead)
ingress:
  enabled: false
# HTTPRoute configuration for Gateway API
httpRoute:
  enabled: true
  annotations: {}
  # Gateway references to attach this HTTPRoute to
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  # Hostnames to match for this HTTPRoute
  hostnames:
    - jellyfin.casa.local
  # Rules for routing traffic
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
# Gateway API configuration (for reference only, httpRoute handles this)
gateway:
  name: traefik-gateway
  namespace: traefik
  gatewayClassName: traefik
  certificateName: local-selfsigned-tls
# HTTPRoute configuration
httproute:
  hostname: jellyfin.casa.local
# Node configuration for static PV binding
node:
  name: k3s-cluster
# Security context
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: false
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # Set to false for Jellyfin to allow writes to cache and transcoding files
  readOnlyRootFilesystem: false
# Hardware acceleration configuration
# Intel QuickSync on Intel N100 (Alder Lake-N) CPU
# This enables hardware transcoding for better performance
hardwareAcceleration:
  enabled: true
  deviceType: intel
  devicePath: /dev/dri
  devices:
    - /dev/dri/renderD128
    - /dev/dri/card0
# Startup probe checks if Gluetun VPN is ready before allowing Jellyfin to start
#
# TEMPORARY WORKAROUND: This probe attempts to delay Jellyfin readiness until Gluetun
# healthcheck endpoint responds, but it's not a complete solution because:
# 1. Jellyfin still starts immediately alongside Gluetun
# 2. Traffic could potentially leak before VPN is fully established
# 3. The proper solution uses native sidecars (extraInitContainers) to block startup
#
# When official chart v3.0.0 is released, this should be removed in favor of using
# extraInitContainers with restartPolicy: Always, which truly blocks Jellyfin from
# starting until Gluetun is healthy.
startupProbe:
  httpGet:
    path: /
    port: 9999
    host: 127.0.0.1
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30 # Give up to 2.5 minutes for VPN connection
# Storage configuration (using official chart's persistence values)
persistence:
  enabled: true
  # Config storage - Jellyfin application configuration
  config:
    enabled: true
    # Use existing static PVC instead of creating a new one
    existingClaim: jellyfin-config
  # Media storage - Used for local media or cache
  media:
    enabled: true
    type: pvc
    # Use existing static PVC instead of creating a new one
    existingClaim: jellyfin-media
# Extra volumes for cache (transcoding)
# The official chart doesn't support cache, so we add it via extra volumes
extraVolumes:
  - name: cache
    persistentVolumeClaim:
      claimName: jellyfin-cache
extraVolumeMounts:
  - name: cache
    mountPath: /cache
# NetworkPolicy configuration (using official chart's values)
networkPolicy:
  enabled: true
  # Allow ingress only from Traefik (for external access)
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8096
  # Allow egress to DNS and external sources (Real-Debrid, etc.)
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - {}
# Node selector - ensures pods run on the k3s-cluster node
nodeSelector:
  kubernetes.io/hostname: k3s-cluster
# Tolerations
tolerations: []
# Affinity
affinity: {}
# VPN sidecar: Gluetun VPN client
# Routes all Jellyfin outbound traffic through ProtonVPN
#
# TEMPORARY WORKAROUND: Using extraContainers because official Helm chart v2.7.0
# doesn't support extraInitContainers with restartPolicy: Always for native sidecars.
#
# PROPER SOLUTION (when chart v3.0.0 is released): Use extraInitContainers with
# restartPolicy: Always to implement native Kubernetes sidecars that block Jellyfin
# startup until VPN is healthy. See: https://github.com/jellyfin/jellyfin-helm
#
# CURRENT LIMITATIONS:
# - Jellyfin starts alongside Gluetun (not blocked by VPN readiness)
# - Jellyfin uses startupProbe to check Gluetun health, but this doesn't fully
#   prevent traffic from leaking before VPN is ready
# - The proper sidecar pattern will ensure no traffic flows until VPN is confirmed
extraContainers:
  - name: gluetun
    image: "ghcr.io/qdm12/gluetun:v3.41.0" # {"$imagepolicy": "flux-system:gluetun-policy:tag"}
    imagePullPolicy: IfNotPresent
    securityContext:
      capabilities:
        add:
          - NET_ADMIN
      privileged: false
      runAsUser: 0
      runAsGroup: 0
    envFrom:
      # Non-sensitive configuration from ConfigMap
      - configMapRef:
          name: gluetun-config
      # Sensitive credentials from Secret
      - secretRef:
          name: gluetun-vpn-credentials
    # Readiness probe checks if VPN interface (tun0) is up and has an IP address
    # This is more reliable for ProtonVPN than checking healthcheck endpoint
    readinessProbe:
      exec:
        command:
          - sh
          - -c
          - "ip addr show tun0 2>/dev/null | grep -q 'inet '"
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    # Liveness probe ensures Gluetun remains healthy
    # Note: failureThreshold is set high to allow Gluetun's internal VPN recovery to work
    livenessProbe:
      exec:
        command:
          - sh
          - -c
          - "ip addr show tun0 2>/dev/null | grep -q 'inet '"
      initialDelaySeconds: 60
      periodSeconds: 60
      timeoutSeconds: 10
      failureThreshold: 2 # Allow up to 2 minutes for VPN recovery
# Additional environment variables
# Note: HTTP_PROXY/HTTPS_PROXY are NOT needed as Gluetun handles routing automatically
extraEnv: []
# - name: JELLYFIN_PublishedServerUrl
#   value: https://jellyfin.casa.local
