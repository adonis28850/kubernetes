apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: radicale-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: radicale
  policy:
    numerical:
      order: asc # This tells Flux to pick the highest number
  filterSelection:
    # This regex matches the 4-digit pattern like 3.6.0.0
    # and ensures we only look at tags that look like versions
    extract: '$1'
    regex: '^([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$'
