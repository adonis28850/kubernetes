apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImageUpdateAutomation
metadata:
  name: image-update-automation
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: kubernetes-repo
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@casa.local
        name: Flux Bot
      # Using a stable string to avoid Go template evaluation errors
      messageTemplate: "chore: Flux image update"
    push:
      branch: main
  update:
    strategy: Setters
    path: ./
